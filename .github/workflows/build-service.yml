# The one build pipeline. App repos call this; they hold no CI logic of their own, so
# improving the build (caching, scanning, a different registry) is one commit here that
# every project inherits.
name: build-service

on:
  workflow_call:
    inputs:
      context:    {type: string, required: false, default: "."}
      dockerfile: {type: string, required: false, default: "Dockerfile"}
      image:      {type: string, required: true}   # e.g. yotampeled/checkers-api
      test:       {type: string, required: false, default: ""}
    # No `secrets:` block, and none is wanted. This workflow used to accept an
    # ORBIT_DISPATCH_TOKEN and spend it on a repository_dispatch that told the platform what
    # had been built. The platform now reads the build event through a GitHub App it owns, so
    # the step went first and the declaration followed it on 2026-08-30 — a caller that still
    # passes the secret is the only thing this removal can break, and all three were cleaned
    # up before it landed. Callers hold no credentials at all now.

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - id: meta
        run: |
          BRANCH="${GITHUB_REF_NAME//\//-}"
          echo "tag=${BRANCH}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # `test` is caller-supplied code by definition — that is the feature. It goes through
      # env so it runs as a command the shell reads from a variable rather than as text
      # spliced into this workflow's own script, which keeps a malformed value from
      # rewriting the steps around it. It is still arbitrary code from the calling repo,
      # running with that repo's own permissions. That is the contract, not a leak.
      - name: Test
        if: inputs.test != ''
        env:
          TEST_CMD: ${{ inputs.test }}
        run: bash -c "$TEST_CMD"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: true
          tags: ghcr.io/${{ inputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
