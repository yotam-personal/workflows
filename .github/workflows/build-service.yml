# The one build pipeline. App repos call this; they hold no CI logic of their own, so
# improving the build (caching, scanning, a different registry) is one commit here that
# every project inherits.
name: build-service

on:
  workflow_call:
    inputs:
      context:    {type: string, required: false, default: "."}
      dockerfile: {type: string, required: false, default: "Dockerfile"}
      image:      {type: string, required: true}   # e.g. yotampeled/checkers-api
      test:       {type: string, required: false, default: ""}
    secrets:
      ORBIT_DISPATCH_TOKEN: {required: true}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - id: meta
        run: |
          BRANCH="${GITHUB_REF_NAME//\//-}"
          echo "tag=${BRANCH}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # `test` is caller-supplied code by definition — that is the feature. It goes through
      # env so it runs as a command the shell reads from a variable rather than as text
      # spliced into this workflow's own script, which keeps a malformed value from
      # rewriting the steps around it. It is still arbitrary code from the calling repo,
      # running with that repo's own permissions. That is the contract, not a leak.
      - name: Test
        if: inputs.test != ''
        env:
          TEST_CMD: ${{ inputs.test }}
        run: bash -c "$TEST_CMD"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: true
          tags: ghcr.io/${{ inputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Notify, never push. An app repo that could commit to the platform repo would be a
      # path from any app repo's leaked credential to arbitrary code in production; and a
      # naive push from two concurrent builds silently loses one of them.
      # Every value travels through env, and the JSON is built by jq rather than by string
      # interpolation. A branch name may legally contain a single quote (git accepts
      # `quote'name`), which broke out of the old single-quoted -d '{...}' and executed as a
      # separate command inside a job holding the dispatch token and packages: write. A
      # double quote let it inject extra client_payload keys. The token moves to env too:
      # inline in a run: script it appears in the process table and in any `set -x` trace.
      - name: Tell the platform
        env:
          GH_TOKEN: ${{ secrets.ORBIT_DISPATCH_TOKEN }}
          IMAGE:    ${{ inputs.image }}
          TAG:      ${{ steps.meta.outputs.tag }}
          BRANCH:   ${{ github.ref_name }}
          REPO:     ${{ github.repository }}
        run: |
          PAYLOAD=$(jq -n \
            --arg image "$IMAGE" --arg tag "$TAG" \
            --arg branch "$BRANCH" --arg repo "$REPO" \
            '{event_type:"image-built",client_payload:{image:$image,tag:$tag,branch:$branch,repo:$repo}}')
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/YotamPeled/yotam-platform/dispatches \
            -d "$PAYLOAD"
